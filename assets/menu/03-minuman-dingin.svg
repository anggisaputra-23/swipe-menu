<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Halaman demo: minuman dingin -->
  <rect width="1240" height="1754" fill="#FAF7F1"/>

  <text x="90" y="190" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="10" fill="#575047">COLD DRINKS</text>
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="98" fill="#101114">Minuman Dingin</text>
  <rect x="90" y="342" width="130" height="9" fill="#C2410C"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <g>
      <text x="90" y="500" font-family="Georgia, serif" font-size="46" fill="#101114">Es Kopi Susu</text>
      <text x="1150" y="500" text-anchor="end" font-size="40" fill="#101114">Rp 22.000</text>
      <line x1="90" y1="522" x2="1150" y2="522" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="566" font-size="30" fill="#575047">Manis, creamy, disajikan dengan es batu.</text>
    </g>
    <g>
      <text x="90" y="685" font-family="Georgia, serif" font-size="46" fill="#101114">Es Americano</text>
      <text x="1150" y="685" text-anchor="end" font-size="40" fill="#101114">Rp 19.000</text>
      <line x1="90" y1="707" x2="1150" y2="707" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="751" font-size="30" fill="#575047">Segar dan tegas, tanpa susu.</text>
    </g>
    <g>
      <text x="90" y="870" font-family="Georgia, serif" font-size="46" fill="#101114">Es Matcha Latte</text>
      <text x="1150" y="870" text-anchor="end" font-size="40" fill="#101114">Rp 26.000</text>
      <line x1="90" y1="892" x2="1150" y2="892" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="936" font-size="30" fill="#575047">Teh hijau pahit-manis dengan susu dingin.</text>
    </g>
    <g>
      <text x="90" y="1055" font-family="Georgia, serif" font-size="46" fill="#101114">Es Cokelat</text>
      <text x="1150" y="1055" text-anchor="end" font-size="40" fill="#101114">Rp 24.000</text>
      <line x1="90" y1="1077" x2="1150" y2="1077" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="1121" font-size="30" fill="#575047">Cokelat pekat, tidak terlalu manis.</text>
    </g>
    <g>
      <text x="90" y="1240" font-family="Georgia, serif" font-size="46" fill="#101114">Es Teh Lemon</text>
      <text x="1150" y="1240" text-anchor="end" font-size="40" fill="#101114">Rp 16.000</text>
      <line x1="90" y1="1262" x2="1150" y2="1262" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="1306" font-size="30" fill="#575047">Teh melati, jeruk nipis, dan madu.</text>
    </g>
    <g>
      <text x="90" y="1425" font-family="Georgia, serif" font-size="46" fill="#101114">Cold Brew</text>
      <text x="1150" y="1425" text-anchor="end" font-size="40" fill="#101114">Rp 25.000</text>
      <line x1="90" y1="1447" x2="1150" y2="1447" stroke="#101114" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="1491" font-size="30" fill="#575047">Diseduh dingin 12 jam, rasa halus.</text>
    </g>
  </g>

  <line x1="90" y1="1640" x2="1150" y2="1640" stroke="#101114" stroke-width="1.5" opacity=".2"/>
  <text x="90" y="1694" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#575047">SWIPE.MENU · MENU DEMO</text>
  <text x="1150" y="1694" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#575047">03</text>
</svg>
