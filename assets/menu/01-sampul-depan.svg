<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Sampul depan demo Swipe.menu -->
  <rect width="1240" height="1754" fill="#F4EFE4"/>
  <!-- Bingkai -->
  <rect x="64" y="64" width="1112" height="1626" fill="none" stroke="#16150F" stroke-width="4"/>
  <rect x="86" y="86" width="1068" height="1582" fill="none" stroke="#16150F" stroke-width="1.5" opacity=".35"/>

  <!-- Lambang swipe -->
  <circle cx="620" cy="420" r="112" fill="#16150F"/>
  <g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M583 380 L617 420 L583 460" stroke="#E8A020"/>
    <path d="M623 380 L657 420 L623 460" stroke="#F4EFE4" opacity=".9"/>
  </g>

  <!-- Wordmark -->
  <text x="620" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="46" font-weight="bold" letter-spacing="4" fill="#16150F">SWIPE<tspan fill="#E8A020">.</tspan>MENU</text>

  <!-- Judul -->
  <text x="620" y="920" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="150" letter-spacing="34" fill="#16150F">MENU</text>
  <rect x="480" y="972" width="280" height="8" fill="#E8A020"/>

  <text x="620" y="1110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" fill="#16150F">Menu Demo</text>
  <text x="620" y="1192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="12" fill="#6B6558">KOPI · MAKANAN · CAMILAN</text>

  <!-- Bawah sampul -->
  <line x1="400" y1="1520" x2="840" y2="1520" stroke="#16150F" stroke-width="1.5" opacity=".3"/>
  <text x="620" y="1592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" letter-spacing="8" fill="#6B6558">DIBUAT DENGAN SWIPE.MENU · 2026</text>
</svg>
