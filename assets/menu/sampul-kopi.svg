  <!-- Bawah sampul -->
  <line x1="400" y1="1520" x2="840" y2="1520" stroke="#101114" stroke-width="1.5" opacity=".3"/>
  <text x="620" y="1592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" letter-spacing="8" fill="#575047">DIBUAT DENGAN SWIPE.MENU · 2026</text>
