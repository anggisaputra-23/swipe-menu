<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Sampul depan menu contoh: kopi -->
  <rect width="1240" height="1754" fill="#FAF7F1"/>
  <!-- Bingkai -->
  <rect x="64" y="64" width="1112" height="1626" fill="none" stroke="#101114" stroke-width="4"/>
  <rect x="86" y="86" width="1068" height="1582" fill="none" stroke="#101114" stroke-width="1.5" opacity=".35"/>

  <!-- Lambang swipe -->
  <circle cx="620" cy="420" r="112" fill="#101114"/>
  <g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M583 380 L617 420 L583 460" stroke="#C2410C"/>
    <path d="M623 380 L657 420 L623 460" stroke="#FAF7F1" opacity=".9"/>
  </g>

  <!-- Wordmark -->
  <text x="620" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
