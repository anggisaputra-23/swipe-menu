<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Halaman demo: camilan & promo -->
  <rect width="1240" height="1754" fill="#F4EFE4"/>

  <text x="90" y="190" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="10" fill="#6B6558">SNACKS &amp; PROMO</text>
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="98" fill="#16150F">Camilan</text>
  <rect x="90" y="342" width="130" height="9" fill="#E8A020"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <g>
      <text x="90" y="510" font-family="Georgia, serif" font-size="46" fill="#16150F">Roti Bakar Cokelat</text>
      <text x="1150" y="510" text-anchor="end" font-size="40" fill="#16150F">Rp 20.000</text>
      <line x1="90" y1="532" x2="1150" y2="532" stroke="#16150F" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="576" font-size="30" fill="#6B6558">Manis lumer, taburan keju parut.</text>
    </g>
    <g>
      <text x="90" y="705" font-family="Georgia, serif" font-size="46" fill="#16150F">Pisang Goreng Keju</text>
      <text x="1150" y="705" text-anchor="end" font-size="40" fill="#16150F">Rp 19.000</text>
      <line x1="90" y1="727" x2="1150" y2="727" stroke="#16150F" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="771" font-size="30" fill="#6B6558">Renyah di luar, lembut di dalam.</text>
    </g>
    <g>
      <text x="90" y="900" font-family="Georgia, serif" font-size="46" fill="#16150F">Croissant Butter</text>
      <text x="1150" y="900" text-anchor="end" font-size="40" fill="#16150F">Rp 22.000</text>
      <line x1="90" y1="922" x2="1150" y2="922" stroke="#16150F" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="966" font-size="30" fill="#6B6558">Lapisan renyah, dipanggang tiap pagi.</text>
    </g>
    <g>
      <text x="90" y="1095" font-family="Georgia, serif" font-size="46" fill="#16150F">Kue Cubit</text>
      <text x="1150" y="1095" text-anchor="end" font-size="40" fill="#16150F">Rp 15.000</text>
      <line x1="90" y1="1117" x2="1150" y2="1117" stroke="#16150F" stroke-width="2" stroke-dasharray="2 8" opacity=".3"/>
      <text x="90" y="1161" font-size="30" fill="#6B6558">Empuk, masih hangat saat disajikan.</text>
    </g>
  </g>

  <!-- Kotak promo -->
  <g>
    <rect x="90" y="1250" width="1060" height="300" rx="18" fill="#E8A020"/>
    <text x="140" y="1345" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="10" fill="#16150F">PROMO</text>
    <text x="140" y="1440" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#16150F">Paket Kombo</text>
    <text x="140" y="1502" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#16150F">2 minuman + 1 camilan — Rp 55.000</text>
    <text x="1100" y="1345" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#16150F" opacity=".75">Senin–Jumat</text>
    <text x="1100" y="1385" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#16150F" opacity=".75">09.00–12.00</text>
  </g>

  <line x1="90" y1="1640" x2="1150" y2="1640" stroke="#16150F" stroke-width="1.5" opacity=".2"/>
  <text x="90" y="1694" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#6B6558">SWIPE.MENU · MENU DEMO</text>
  <text x="1150" y="1694" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6B6558">05</text>
</svg>
