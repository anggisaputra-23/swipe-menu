<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Halaman demo: makanan -->
  <rect width="1240" height="1754" fill="#FAF7F1"/>

  <text x="90" y="190" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="10" fill="#575047">FOOD</text>
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="98" fill="#101114">Makanan</text>
