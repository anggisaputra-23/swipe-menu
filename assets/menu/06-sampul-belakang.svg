<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <!-- Sampul belakang demo Swipe.menu -->
  <rect width="1240" height="1754" fill="#101114"/>
  <rect x="64" y="64" width="1112" height="1626" fill="none" stroke="#C2410C" stroke-width="3" opacity=".7"/>

  <!-- Lambang swipe -->
  <circle cx="620" cy="560" r="112" fill="#C2410C"/>
  <g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M583 520 L617 560 L583 600" stroke="#101114"/>
    <path d="M623 520 L657 560 L623 600" stroke="#101114" opacity=".55"/>
  </g>

  <text x="620" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" fill="#FAF7F1">Menu ini dibuat dengan</text>
  <text x="620" y="890" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="86" fill="#C2410C">Swipe.menu</text>

  <line x1="420" y1="970" x2="820" y2="970" stroke="#FAF7F1" stroke-width="1.5" opacity=".35"/>

  <text x="620" y="1070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="34" letter-spacing="6" fill="#FAF7F1" opacity=".85">Buat menu digital kamu sendiri,</text>
  <text x="620" y="1125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="34" letter-spacing="6" fill="#FAF7F1" opacity=".85">cukup unggah gambarnya.</text>

  <rect x="440" y="1230" width="360" height="86" rx="43" fill="#C2410C"/>
  <text x="620" y="1286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="34" font-weight="bold" fill="#101114">swipemenu.app</text>

  <text x="620" y="1580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="26" letter-spacing="8" fill="#FAF7F1" opacity=".55">TERIMA KASIH SUDAH MAMPIR</text>
</svg>
